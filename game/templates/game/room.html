

<h2>Room Code: {{ room.code }}</h2>

<h3>Players:</h3>
<ul>
  {% for player in players %}
    <li>
      {{ player.name }}
      {% if player == current_player %}
      - {{player.role}}
      {% else %}
      - Role hidden🔒
      {% endif %}

    </li>
  {% endfor %}
</ul>

{% if players|length >= 3 %}
    <a href="{% url 'start_game' room.code %}">
        <button>Start Game</button>
    </a>
{% else %}
    <p>Waiting for more players...</p>
{% endif %}
